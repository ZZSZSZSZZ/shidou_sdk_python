name: ci

# Validates the committed prebuilt payload on every platform it ships for.
# Each leg runs on the architecture and OS it ships, so the aarch64 objects
# are loaded and exercised for real here (a development x86_64 host cannot
# do that) and the Windows legs load the committed DLLs on Windows. A
# platform whose payload is not committed yet has no leg; its leg arrives
# with its payload. release.yml reuses this definition on tags
# (workflow_call), so the push-time and tag-time checks cannot drift.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: import and peer-mode check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux, python: python3, venv: .venv/bin }
          - { os: ubuntu-22.04-arm, platform: linux-arm64, python: python3, venv: .venv/bin }
          - { os: windows-latest, platform: win, python: python, venv: .venv/Scripts }
          - { os: windows-11-arm, platform: win-arm64, python: python, venv: .venv/Scripts }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Assert the interpreter is the architecture this leg ships
        shell: bash
        run: |
          set -eu
          # The leg's claim is that the object it ships is loaded here, so the
          # architecture to check is the one of the process that loads it --
          # the interpreter's -- and a shell probe cannot report that: on
          # Windows ARM64, Git Bash is an emulated x86_64 MSYS binary whose
          # uname and PROCESSOR_ARCHITECTURE both describe the emulated
          # process rather than the host. This is also the value _abi.py
          # resolves _lib/<slug>/ with, so a leg that passes here imports the
          # payload directory it ships, not the one for the emulated host.
          machine=$(${{ matrix.python }} -c 'import platform; print(platform.machine())' \
            | tr -d '\r')
          # The spellings the interpreter reports on each system, normalized
          # to the architecture names above.
          case "$machine" in
            arm64|ARM64|aarch64) machine=aarch64 ;;
            amd64|AMD64|x86_64) machine=x86_64 ;;
          esac
          case "${{ matrix.platform }}" in
            linux) expected=x86_64 ;;
            linux-arm64) expected=aarch64 ;;
            win) expected=x86_64 ;;
            win-arm64) expected=aarch64 ;;
          esac
          # RUNNER_ARCH is the platform's own record of the machine the leg
          # was scheduled on; printed alongside so that a disagreement
          # between the two is visible in the log.
          if [ "$machine" != "$expected" ]; then
            echo "interpreter is $machine (RUNNER_ARCH $RUNNER_ARCH), this leg ships $expected"
            exit 1
          fi
          echo "interpreter is $machine (RUNNER_ARCH $RUNNER_ARCH)"

      - name: Assert the payload resolves beside itself (ELF)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          libdir="shidou/_lib/${{ matrix.platform }}"
          test -f "$libdir/libshidou_py.so"
          test -f "$libdir/libzenohc.so"
          readelf -d "$libdir/libshidou_py.so" | grep -F '(RUNPATH)'
          readelf -d "$libdir/libshidou_py.so" | grep -F '$ORIGIN'

      - name: Assert the payload resolves beside itself (PE)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          libdir="shidou/_lib/${{ matrix.platform }}"
          test -f "$libdir/shidou_py.dll"
          test -f "$libdir/zenohc.dll"
          # PE has no RUNPATH: the loader resolves the runtime only after
          # _abi.py adds the binding's own directory to the DLL search path,
          # so what is asserted here is that the two files ship side by side
          # for that directory to exist, and that the committed binding is
          # the architecture this leg's runner can load -- the field the
          # assembler guards on (AMD64 0x8664 / ARM64 0xAA64).
          ${{ matrix.python }} - "$libdir" "${{ matrix.platform }}" <<'PY'
          import struct
          import sys

          expected = {"win": 0x8664, "win-arm64": 0xAA64}[sys.argv[2]]
          names = {0x8664: "AMD64", 0xAA64: "ARM64"}
          data = open(sys.argv[1] + "/shidou_py.dll", "rb").read()
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[:2] == b"MZ" and data[pe_offset:pe_offset + 4] == b"PE\0\0", \
              "shidou_py.dll is not a PE image"
          machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
          assert machine == expected, \
              "shidou_py.dll is not %s (0x%04x)" % (names[expected], machine)
          print("shidou_py.dll is %s (0x%04x)" % (names[expected], expected))
          PY

      - name: Peer-mode check without pip
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eu
          # The payload ships no tests; this exercises the committed object
          # and the package around it directly. Peer mode needs no robot and
          # no bridge, but still opens a session and builds every comm object.
          ${{ matrix.python }} - <<'PY'
          import shidou

          robot = shidou.Robot(shidou.Config(robot_address="", mode="peer",
                                             enable_scouting=False))
          assert robot.ready, "peer-mode session did not come up"
          assert robot.last_feedback() is None
          assert robot.feedback_age_ms == -1.0 and robot.feedback_seq == 0
          assert robot.fsm_state == ""
          assert not robot.send_mit(motor_ids=[1, 2], positions=[0.1]), \
              "arrays out of alignment were accepted"
          assert "positions" in robot.last_error()
          assert robot.send_mit(motor_ids=[1, 2], positions=[0.0, 0.0]), \
              "a well-formed frame was refused"

          # Every handle opens the session it runs on: a second Robot with a
          # namespace of its own comes up ready and publishes there, and
          # closing it leaves the first handle working.
          second = shidou.Robot(shidou.Config(robot_address="", mode="peer",
                                              enable_scouting=False, ns="second"))
          assert second.ready, "a second handle's session did not come up"
          assert second.send_mit(motor_ids=[1], positions=[0.0]), \
              "the second handle's session did not publish"
          second.close()
          assert robot.ready and robot.send_mit(motor_ids=[1], positions=[0.0]), \
              "closing one handle disturbed the other"

          # Kept for callers written against older payloads: a no-op now, and
          # an open handle must be untouched by it.
          shidou.shutdown()
          assert robot.ready, "shutdown() disturbed an open handle"
          print("payload imported and came up in peer mode")
          PY

      - name: Editable install
        shell: bash
        run: |
          set -eu
          if ! ${{ matrix.python }} -m venv .venv; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "could not create a venv with the runner's python"
              exit 1
            fi
            # The Linux image ships python3 but not always python3-venv.
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-venv
            ${{ matrix.python }} -m venv .venv
          fi
          # A distro venv seeds an old pip, and an old pip cannot build with a
          # current setuptools: it reports the backend as missing the
          # build_editable hook. Upgrade before installing, on either platform.
          "${{ matrix.venv }}/python" -m pip install --quiet --upgrade pip
          "${{ matrix.venv }}/python" -m pip install --quiet -e .

      - name: Import from the installed package, outside the tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          "$GITHUB_WORKSPACE/${{ matrix.venv }}/python" - <<'PY'
          import shidou

          print(shidou.__file__)
          robot = shidou.Robot(shidou.Config(robot_address="", mode="peer",
                                             enable_scouting=False))
          assert robot.ready, "peer-mode session did not come up"
          print("installed package came up in peer mode")
          PY

      - name: Examples parse
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eu
          for name in get_state get_joint set_fsm mit_control pushrod_control chassis_control; do
            ${{ matrix.python }} "examples/$name.py" --help > /dev/null
          done

      - name: Wheel carries the four payload directories
        shell: bash
        run: |
          set -eu
          "${{ matrix.venv }}/python" -m pip wheel --quiet --no-deps --wheel-dir dist .
          "${{ matrix.venv }}/python" - <<'PY'
          import glob
          import zipfile

          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          objects = {
              "linux": ("libshidou_py.so", "libzenohc.so"),
              "linux-arm64": ("libshidou_py.so", "libzenohc.so"),
              "win": ("shidou_py.dll", "zenohc.dll"),
              "win-arm64": ("shidou_py.dll", "zenohc.dll"),
          }
          # Every release tree ships all four payload directories, so the
          # wheel must carry each of them in full: a directory that went
          # missing fails here by name instead of shipping a package whose
          # payload resolves on only some of the platforms it claims.
          for slug in ("linux", "linux-arm64", "win", "win-arm64"):
              for name in objects[slug]:
                  member = "shidou/_lib/{}/{}".format(slug, name)
                  assert member in names, "missing " + member
          print("wheel carries all four payload directories")
          PY
