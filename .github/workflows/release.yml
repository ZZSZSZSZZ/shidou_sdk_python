name: release

# Tag releases: validate the committed prebuilt payload on both
# architectures (each leg on the architecture it ships, so the aarch64
# object is really loaded), then attach archives of the tagged tree to the
# GitHub Release of the pushed tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    name: validate (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux }
          - { os: ubuntu-22.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the assembled version
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match payload version $version"
            exit 1
          fi

      - name: Assert runner architecture
        shell: bash
        run: |
          set -eu
          machine=$(uname -m)
          case "${{ matrix.platform }}" in
            linux) expected=x86_64 ;;
            linux-arm64) expected=aarch64 ;;
          esac
          if [ "$machine" != "$expected" ]; then
            echo "runner is $machine, this leg ships $expected"
            exit 1
          fi

      - name: Assert the payload resolves beside itself
        shell: bash
        run: |
          set -eu
          libdir="shidou/_lib/${{ matrix.platform }}"
          test -f "$libdir/libshidou_py.so"
          test -f "$libdir/libzenohc.so"
          readelf -d "$libdir/libshidou_py.so" | grep -F '(RUNPATH)'
          readelf -d "$libdir/libshidou_py.so" | grep -F '$ORIGIN'

      - name: Peer-mode check without pip
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eu
          # The payload ships no tests; this exercises the committed object
          # and the package around it directly. Peer mode needs no robot and
          # no bridge, but still opens a session and builds every comm object.
          python3 - <<'PY'
          import shidou

          robot = shidou.Robot(shidou.Config(robot_address="", mode="peer",
                                             enable_scouting=False))
          assert robot.ready, "peer-mode session did not come up"
          assert robot.last_feedback() is None
          assert robot.feedback_age_ms == -1.0 and robot.feedback_seq == 0
          assert robot.fsm_state == ""
          assert not robot.send_mit(motor_ids=[1, 2], positions=[0.1]), \
              "arrays out of alignment were accepted"
          assert "positions" in robot.last_error()
          assert robot.send_mit(motor_ids=[1, 2], positions=[0.0, 0.0]), \
              "a well-formed frame was refused"
          print("payload imported and came up in peer mode")
          PY

      - name: Editable install
        shell: bash
        run: |
          set -eu
          if ! python3 -m venv .venv; then
            # The image ships python3 but not always python3-venv.
            sudo apt-get update -qq
            sudo apt-get install -y -qq python3-venv
            python3 -m venv .venv
          fi
          # A distro venv seeds an old pip, and an old pip cannot build with a
          # current setuptools: it reports the backend as missing the
          # build_editable hook.
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -e .

      - name: Import from the installed package, outside the tree
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -eu
          "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import shidou

          print(shidou.__file__)
          robot = shidou.Robot(shidou.Config(robot_address="", mode="peer",
                                             enable_scouting=False))
          assert robot.ready, "peer-mode session did not come up"
          print("installed package came up in peer mode")
          PY

      - name: Examples parse
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eu
          for name in get_state get_joint set_fsm mit_control pushrod_control chassis_control; do
            python3 "examples/$name.py" --help > /dev/null
          done

      - name: Wheel carries both payloads
        shell: bash
        run: |
          set -eu
          .venv/bin/pip wheel --quiet --no-deps --wheel-dir dist .
          .venv/bin/python - <<'PY'
          import glob
          import zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for slug in ("linux", "linux-arm64"):
              for name in ("libshidou_py.so", "libzenohc.so"):
                  member = "shidou/_lib/{}/{}".format(slug, name)
                  assert member in names, "missing " + member
          print("wheel carries both payloads")
          PY

  publish:
    name: publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive tagged tree
        run: |
          git archive --format=tar.gz -o shidou_sdk_python-$GITHUB_REF_NAME.tar.gz HEAD
          git archive --format=zip -o shidou_sdk_python-$GITHUB_REF_NAME.zip HEAD

      - name: Create release with tree archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            shidou_sdk_python-$GITHUB_REF_NAME.tar.gz \
            shidou_sdk_python-$GITHUB_REF_NAME.zip \
            --generate-notes --repo "$GITHUB_REPOSITORY"
