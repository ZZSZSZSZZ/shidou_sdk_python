name: release

# Tag releases: validate the committed prebuilt payload on both
# architectures (each leg on the architecture it ships, so the aarch64
# object is really loaded) by calling ci.yml, then attach archives of the
# tagged tree to the GitHub Release of the pushed tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Release-only: the tag must name the assembled version. ci.yml also runs
  # on branch pushes, where GITHUB_REF_NAME is a branch name.
  tag-check:
    name: tag matches the assembled version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the assembled version
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match payload version $version"
            exit 1
          fi

  validate:
    # ci.yml's import / install / wheel definition, reused so the tag-time
    # check cannot drift from the push-time one; the matrix legs, their
    # runner and the timeout live there.
    needs: tag-check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Archive tagged tree
        run: |
          git archive --format=tar.gz -o shidou_sdk_python-$GITHUB_REF_NAME.tar.gz HEAD
          git archive --format=zip -o shidou_sdk_python-$GITHUB_REF_NAME.zip HEAD

      - name: Create release with tree archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            shidou_sdk_python-$GITHUB_REF_NAME.tar.gz \
            shidou_sdk_python-$GITHUB_REF_NAME.zip \
            --generate-notes --repo "$GITHUB_REPOSITORY"
